<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verify an ownership contract | MercaDream Studio</title>
<meta name="description" content="Check that a MercaDream Studio song ownership contract is genuine."/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#E8B92F;--gold-dim:#4d3d0a;--line:#1f1f1f;--line2:#2a2a2a;--text:#ececec;--soft:#bdbdbd;--muted:#a3a3a3;--green:#5fd38a;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:var(--gold);text-decoration:none}
header{border-bottom:1px solid var(--line)}
header div{max-width:820px;margin:0 auto;padding:16px 24px}
.logo{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.08em;color:var(--gold);font-size:20px}
.logo small{font-size:11px;letter-spacing:.3em;margin-left:8px}
main{max-width:820px;margin:0 auto;padding:40px 24px 60px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-family:Orbitron,sans-serif;font-size:30px;color:#fff}
.lead{margin:0;color:var(--soft)}
form{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 260px;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:12px 14px;text-transform:uppercase}
input:focus{border-color:var(--gold);outline:none}
button{background:var(--gold);color:#0a0a0a;border:0;border-radius:6px;padding:0 22px;min-height:48px;font-weight:600;font-size:16px;cursor:pointer;font-family:Inter,sans-serif}
.card{border:1px solid var(--line2);border-radius:12px;background:#111;padding:24px;display:flex;flex-direction:column;gap:16px}
.ok{border-color:#1f5a35;background:#0c1510}
.bad{border-color:#5a1f1f;background:#150c0c}
.state{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600}
.state .i{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.ok .i{background:var(--green);color:#0a0a0a}
.bad .i{background:var(--red);color:#0a0a0a}
dl{display:grid;grid-template-columns:180px 1fr;gap:8px 16px;margin:0}
dt{color:var(--muted);font-size:14px}
dd{margin:0;unicode-bidi:plaintext}
.hash{font-family:'IBM Plex Mono',monospace;font-size:12px;word-break:break-all;color:var(--soft)}
.check{border-top:1px solid var(--line2);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.check p{margin:0;font-size:14px;color:var(--soft)}
.res{font-weight:600}
.res.y{color:var(--green)} .res.n{color:var(--red)}
.hidden{display:none!important}
@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>
</head>
<body>
<header><div><a class="logo" href="index.html">MERCADREAM<small>STUDIO</small></a></div></header>
<main>
  <h1>Verify a contract</h1>
  <p class="lead">Every song ownership contract issued by MercaDream Studio is registered with a unique number. Enter the number printed on the contract, or scan its QR code.</p>
  <form id="f"><label for="no" class="hidden">Contract number</label><input type="text" id="no" placeholder="MDS-2026-XXXXXXXX" autocomplete="off" spellcheck="false"/><button type="submit">Verify</button></form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function day(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ', ' + d.toISOString().slice(11, 16) + ' UTC'; }
  function dur(s) { return s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '—'; }
  var current = null;

  async function check(no) {
    no = String(no || '').trim().toUpperCase();
    if (!no) return;
    $('no').value = no;
    history.replaceState(null, '', '?id=' + encodeURIComponent(no));
    $('out').innerHTML = '<p class="lead">Checking…</p>';
    try {
      var r = await fetch('/api/verify?id=' + encodeURIComponent(no));
      var d = await r.json().catch(function () { return {}; });
      if (!d.valid) {
        $('out').innerHTML = '<div class="card bad"><div class="state"><span class="i">✕</span>Not a valid contract</div><p class="lead">' + esc(d.error || 'No contract with this number is registered at MercaDream Studio.') + '</p></div>';
        return;
      }
      current = d;
      $('out').innerHTML =
        '<div class="card ok"><div class="state"><span class="i">✓</span>Genuine contract</div>' +
        '<dl>' +
        '<dt>Contract number</dt><dd class="hash" style="font-size:14px;color:#fff">' + esc(d.certNo) + '</dd>' +
        '<dt>Song title</dt><dd>' + esc(d.title) + '</dd>' +
        '<dt>Holder</dt><dd>' + esc(d.holderName) + (d.holderType === 'company' ? ' (company)' : '') + (d.artistName ? ' — known as ' + esc(d.artistName) : '') + '</dd>' +
        '<dt>Issued</dt><dd>' + day(d.issuedAt) + '</dd>' +
        '<dt>Title locked</dt><dd>' + day(d.titleLockedAt) + '</dd>' +
        '<dt>Lyrics locked</dt><dd>' + day(d.lyricsLockedAt) + '</dd>' +
        '<dt>Produced</dt><dd>' + day(d.producedAt) + '</dd>' +
        '<dt>Human-written lyrics</dt><dd>' + esc(d.humanPct) + '%</dd>' +
        '<dt>Duration</dt><dd>' + dur(d.durationSec) + '</dd>' +
        '<dt>Audio SHA-256</dt><dd class="hash">' + esc(d.audioSha256) + '</dd>' +
        '<dt>Lyrics SHA-256</dt><dd class="hash">' + esc(d.lyricsSha256) + '</dd>' + '<dt>Independent copy</dt><dd><a href="https://github.com/ottomohamed/mercadream-registry/blob/main/registry/' + encodeURIComponent(d.certNo) + '.json" target="_blank" rel="noopener">Public registry on GitHub</a></dd>' + '<dt>Independent copy</dt><dd><a href="https://git '<dt>Independent copy</dt><dd><a href="https://git '<dt>Independent copy</dt><dd><a href="https://git
        '</dl>' +
        '<div class="check"><p><b>Is this the same audio file?</b> Choose the MP3 file to compare its fingerprint with the contract. The file stays on your device.</p>' +
        '<input type="file" id="file" accept="audio/*"/><p class="res" id="res"></p></div>' +
        '</div>';
      $('file').addEventListener('change', compare);
    } catch (e) {
      $('out').innerHTML = '<div class="card bad"><div class="state"><span class="i">!</span>Could not check right now</div><p class="lead">Please try again in a moment.</p></div>';
    }
  }

  async function compare(e) {
    var f = e.target.files && e.target.files[0]; if (!f || !current) return;
    $('res').className = 'res'; $('res').textContent = 'Calculating…';
    try {
      var buf = await f.arrayBuffer();
      var h = await crypto.subtle.digest('SHA-256', buf);
      var hex = Array.prototype.map.call(new Uint8Array(h), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      var same = hex === String(current.audioSha256).toLowerCase();
      $('res').className = 'res ' + (same ? 'y' : 'n');
      $('res').textContent = same ? '✓ This file is exactly the song registered in the contract.' : '✕ This file is different from the song registered in the contract.';
    } catch (err) { $('res').textContent = 'Could not read this file.'; }
  }

  $('f').addEventListener('submit', function (e) { e.preventDefault(); check($('no').value); });
  var id = new URLSearchParams(location.search).get('id');
  if (id) check(id);
})();
</script>
</body>
</html>
